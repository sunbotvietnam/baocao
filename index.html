<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#FF6B00" />
  <title>Sunbot GV - Báo cáo ca học</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --safe-top: env(safe-area-inset-top, 16px); --safe-bottom: env(safe-area-inset-bottom, 18px); }
    html, body { margin:0; min-height:100%; background:#F2F2F7; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
    input, select, textarea { font-size:16px !important; background:#fff; }
    .active-scale:active { transform:scale(.98); opacity:.85; transition:.08s; }
    .loader { border:3px solid #f3f3f3; border-top:3px solid #FF6B00; border-radius:50%; width:26px; height:26px; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .fade { animation: fade .2s ease-out; }
    @keyframes fade { from { opacity:0; transform:translateY(8px);} to {opacity:1; transform:translateY(0);} }
  </style>
</head>
<body>
  <div id="app"></div>
<script>
(function(){
  'use strict';

  // =========================================================
  // DÁN LINK WEB APP URL CỦA APPS SCRIPT V3 VÀO ĐÂY
  // Ví dụ: https://script.google.com/macros/s/xxx/exec
  // =========================================================
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw10ir7IsThcgNNRMU-cWH_6i1L-GK93JSGqyjt0jgWTWwScNlYlHOVXdK6nXaVfz9-UQ/exec";
  const EVALUATION_APP_URL = "https://sunbotvietnam.github.io/report/";
  const APP_VERSION = "teacher-report-v3-9-ultra-compact-2026-05";
  const MAX_IMAGE_PX = 900;
  const IMAGE_QUALITY = 0.62;

  const CHECKLIST = ["Đến lớp đúng giờ", "Đủ học cụ/Robot", "Dạy đúng kịch bản", "Trẻ tham gia tốt", "Dọn dẹp gọn gàng"];
  const CRITERIA = ["Tập trung & Tham gia", "Tuân thủ quy tắc", "Giải quyết vấn đề", "Hợp tác & Giao tiếp", "An toàn học cụ"];
  const PHOTO_CATS = ["Hoạt động học", "Sản phẩm trẻ", "Tương tác nhóm", "Thực hành", "Tổng thể lớp", "Khác"];
  const CHILD_SIGNALS = ["Hào hứng tham gia", "Biết hợp tác", "Biết chờ lượt", "Biết thử lại", "Biết quan sát robot", "Tự tin hơn", "Có ý tưởng sáng tạo", "Hỗ trợ bạn", "Cần hỗ trợ thêm"];
  const LESSON_PREFIX_HINT = "Gõ L = Sunbot, Q = STEAM, T = Tổng kết, G = Gigo, K = Các bài còn lại";
  const SUNBOT_LOGO_URL = "https://static.sunbot.vn/static/images/lesson/11461/logo-sunbot-1.png";
  const TEACHER_QUOTES = [
    "Mỗi giờ học tốt bắt đầu từ một người thầy có mặt thật sự với trẻ.",
    "Dạy công nghệ cho trẻ nhỏ không phải để trẻ thành kỹ sư sớm, mà để trẻ biết tò mò, thử lại và tự tin khám phá.",
    "Một khoảnh khắc trẻ hiểu ra điều mới chính là phần thưởng đẹp nhất của người dạy.",
    "Giáo dục STEAM bắt đầu từ đôi mắt biết quan sát và đôi tay dám thử nghiệm.",
    "Người giáo viên tốt không chỉ truyền đạt bài học, mà còn mở ra cho trẻ một cách nhìn thế giới.",
    "Hôm nay trẻ biết chờ lượt, hợp tác và thử lại; đó đã là một bước tiến rất đáng ghi nhận.",
    "Robot là công cụ. Điều quan trọng hơn là trẻ học cách suy nghĩ, lựa chọn và cùng bạn giải quyết nhiệm vụ.",
    "Một lớp học có giá trị là lớp học để lại trong trẻ sự háo hức muốn khám phá thêm.",
    "Mỗi báo cáo ca học không chỉ là dữ liệu, mà là dấu vết của một hành trình giáo dục.",
    "Người dạy trẻ nhỏ cần sự chính xác của người làm nghề và sự ấm áp của người đồng hành."
  ];
  const SESSION_QUOTE = TEACHER_QUOTES[Math.floor(Math.random() * TEACHER_QUOTES.length)];
  const CONFIG_CACHE_KEY = "sunbot_report_config_cache_v35";
  const CONFIG_CACHE_TTL_MS = 12 * 60 * 60 * 1000;
  const ENROLLMENT_CACHE_PREFIX = "sunbot_enrollment_cache_v35_";

  const DEMO_CONFIG = {
    teachers: [
      {teacher_id:"TCH-DEMO-001", teacher_name:"Giáo viên Demo", active:true},
      {teacher_id:"TCH-HN-DMH", teacher_name:"Đỗ Thị Minh Hằng", active:true}
    ],
    schools: [
      {school_id:"HN-QM", school_name:"Quỳnh Mai", active:true},
      {school_id:"NA-HHT", school_name:"Hà Huy Tập", active:true}
    ],
    classes: [
      {class_id:"CLS-HN-QM-2526-A1", school_id:"HN-QM", class_name:"A1", student_count:25, active:true},
      {class_id:"CLS-HN-QM-2526-A4", school_id:"HN-QM", class_name:"A4", student_count:24, active:true},
      {class_id:"CLS-HN-QM-2526-B2", school_id:"HN-QM", class_name:"B2", student_count:26, active:true},
      {class_id:"CLS-NA-HHT-2526-4A", school_id:"NA-HHT", class_name:"4A", student_count:23, active:true}
    ],
    lessons: [
      {lesson_id:"LES-TKT-003", lesson_code:"TKT-3", lesson_name:"Tư duy thuật toán 3", program_type:"Niên chế", module:"Robot", active:true},
      {lesson_id:"LES-Q2-019", lesson_code:"Q2-19", lesson_name:"Bài Q2-19", program_type:"Niên chế", module:"Robot", active:true},
      {lesson_id:"LES-LV3-B9", lesson_code:"LV3-B9", lesson_name:"LV3-B9", program_type:"Niên chế", module:"Robot", active:true}
    ],
    enrollment: [
      {child_id:"SBK-000001", enrollment_id:"ENR-HN-QM-2526-A1-001", child_name:"Nguyễn Gia Bảo A", school_id:"HN-QM", class_id:"CLS-HN-QM-2526-A1", class_name:"A1", status:"học"},
      {child_id:"SBK-000002", enrollment_id:"ENR-HN-QM-2526-A1-002", child_name:"Nguyễn Diệu Anh", school_id:"HN-QM", class_id:"CLS-HN-QM-2526-A1", class_name:"A1", status:"học"},
      {child_id:"SBK-000010", enrollment_id:"ENR-HN-QM-2526-A4-001", child_name:"Trần Minh Khang", school_id:"HN-QM", class_id:"CLS-HN-QM-2526-A4", class_name:"A4", status:"học"}
    ]
  };

  const state = {
    loading: false,
    configLoading: true,
    enrollmentLoading: false,
    configError: "",
    enrollmentError: "",
    config: {teachers:[], schools:[], classes:[], lessons:[], enrollment:[]},
    data: {
      teacher_id:"", school_id:"", session_date: todayISO(), lesson_id:"", lesson_search:"",
      report_type:"REG",
      selected_classes: [""], class_attendance: {},
      checklist: CHECKLIST.map(()=>false),
      incident_status:"NO", incident_desc:"",
      attendance_photo_b64:"", activity_photo_b64:"",
      criteria: CRITERIA.map(()=>"Đạt"),
      monthly_photos: Array(6).fill(0).map(()=>({cat:PHOTO_CATS[0], img:""})),
      outstanding_children: [], attention_children: [], child_note_text:"",
      highlight:"", needs_attention:"", teacher_comment:"", next_plan:"",
      memory_enabled:false, memory_title:"", memory_signal:"", memory_description:"", memory_photo_b64:""
    },
    lastResult: null
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const norm = (v) => String(v == null ? "" : v).trim();
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function isTruthy(v){ return v === true || String(v).toUpperCase() === 'TRUE' || String(v).toLowerCase() === 'active' || String(v).trim() === ''; }
  function byId(arr, key, id){ return (arr||[]).find(x => String(x[key]) === String(id)); }
  function teacher(){ return byId(state.config.teachers, 'teacher_id', state.data.teacher_id) || {}; }
  function school(){ return byId(state.config.schools, 'school_id', state.data.school_id) || {}; }
  function lesson(){ return byId(state.config.lessons, 'lesson_id', state.data.lesson_id) || {}; }
  function classObj(id){ return byId(state.config.classes, 'class_id', id) || {}; }
  function activeClassesForSchool(){ return state.config.classes.filter(c => c.school_id === state.data.school_id && isTruthy(c.active) && String(c.status || 'active').toLowerCase() !== 'closed'); }
  function activeChildren(){
    const set = new Set(state.data.selected_classes.filter(Boolean));
    return state.config.enrollment.filter(e => set.has(e.class_id) && (!e.status || String(e.status).toLowerCase().includes('học') || String(e.status).toLowerCase().includes('hoc') || String(e.status).toLowerCase()==='active'));
  }
  function selectedClassIds(){ return state.data.selected_classes.filter(Boolean); }
  function totalAttendance(){ return selectedClassIds().reduce((sum, cid) => sum + (Number(state.data.class_attendance[cid]) || 0), 0); }
  function saveLocal(){
    const d = state.data;
    localStorage.setItem("sunbot_report_v3", JSON.stringify({teacher_id:d.teacher_id, school_id:d.school_id, lesson_id:d.lesson_id, lesson_search:d.lesson_search}));
  }
  function loadLocal(){
    try { Object.assign(state.data, JSON.parse(localStorage.getItem("sunbot_report_v3") || "{}")); state.data.session_date = todayISO(); } catch(e) {}
  }
  function section(title, sub){ return `<div class="mx-4 mt-3 mb-1"><div class="text-[11px] font-bold tracking-wide uppercase text-gray-500">${esc(title)}</div>${sub ? `<div class="text-[10px] text-gray-400 mt-0.5 leading-tight">${esc(sub)}</div>` : ''}</div>`; }
  function card(html){ return `<div class="bg-white mx-4 rounded-xl shadow-sm border border-gray-100 overflow-hidden">${html}</div>`; }
  function optionList(items, valueKey, labelFn, selected, placeholder){ return `<option value="">${esc(placeholder || "Chọn...")}</option>` + (items||[]).map(x => `<option value="${esc(x[valueKey])}" ${String(x[valueKey])===String(selected)?'selected':''}>${esc(labelFn(x))}</option>`).join(''); }

  function lessonCode(l){ return String(l.lesson_code || l.lesson_id || '').trim().toUpperCase(); }
  function lessonGroupKey(l){
    const code = lessonCode(l);
    if(code.startsWith('L')) return 'L';
    if(code.startsWith('Q')) return 'Q';
    if(code.startsWith('T')) return 'T';
    if(code.startsWith('G')) return 'G';
    return 'K';
  }
  function groupName(key){
    return ({L:'Sunbot', Q:'STEAM', T:'Tổng kết', G:'Gigo', K:'Các bài còn lại', ALL:'Toàn bộ'})[key] || 'Toàn bộ';
  }
  function detectLessonGroup(query){
    const q = norm(query).toUpperCase();
    if(!q) return '';
    const first = q.charAt(0);
    if(['L','Q','T','G','K'].includes(first)) return first;
    return 'ALL';
  }
  function filteredLessons(){
    const all = (state.config.lessons||[]).filter(l => isTruthy(l.active));
    const qRaw = norm(state.data.lesson_search);
    const q = qRaw.toLowerCase();
    if(!qRaw) return [];
    const group = detectLessonGroup(qRaw);
    let pool = all;
    if(group && group !== 'ALL') pool = all.filter(l => lessonGroupKey(l) === group);
    // Nếu giáo viên chỉ gõ 1 chữ nhóm L/Q/T/G/K thì chỉ lọc theo nhóm.
    if(qRaw.trim().length === 1 && ['l','q','t','g','k'].includes(qRaw.trim().toLowerCase())) return pool;
    return pool.filter(l => [l.lesson_code,l.lesson_name,l.program_type,l.module,l.theme].join(' ').toLowerCase().includes(q));
  }
  function activeLessonCount(){ return (state.config.lessons||[]).filter(l => isTruthy(l.active)).length; }
  function lessonSearchSummary(){
    const q = norm(state.data.lesson_search);
    if(!q) return `Chưa lọc bài. ${LESSON_PREFIX_HINT}.`;
    const group = detectLessonGroup(q);
    const shown = filteredLessons().length;
    if(group && group !== 'ALL') return `Đang hiển thị ${shown} bài thuộc nhóm ${group} · ${groupName(group)}. Tổng danh mục: ${activeLessonCount()} bài.`;
    return `Đang hiển thị ${shown}/${activeLessonCount()} bài theo từ khóa “${q}”.`;
  }

  function lessonLabel(l){
    const code = l.lesson_code || l.lesson_id || '';
    const name = l.lesson_name || '';
    return `${code}${name ? ' — ' + name : ''}`;
  }
  function normalizeLessonText(v){ return norm(v).toLowerCase().replace(/\s+/g,' '); }
  function findLessonByInput(input){
    const target = normalizeLessonText(input);
    if(!target) return null;
    return (state.config.lessons || []).find(l => {
      const label = normalizeLessonText(lessonLabel(l));
      const code = normalizeLessonText(l.lesson_code || '');
      const id = normalizeLessonText(l.lesson_id || '');
      return target === label || target === code || target === id || label.startsWith(target + ' —');
    }) || null;
  }

  function showFatalError(err){
    const app = document.getElementById('app');
    if(app){
      app.innerHTML = `<div style="padding:16px;font-family:Arial,sans-serif"><div style="background:#fff;border:1px solid #fecaca;border-radius:14px;padding:16px;color:#991b1b"><b>App gặp lỗi hiển thị.</b><br><br><div style="font-size:13px;white-space:pre-wrap">${esc(err && (err.stack || err.message) || err)}</div><br><button onclick="location.reload()" style="background:#ff6b00;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:bold">Tải lại app</button></div></div>`;
    }
  }

  function render(){
    try {
    const d = state.data;
    const cfg = state.config;
    const cls = activeClassesForSchool();
    const children = activeChildren();
    const total = totalAttendance();
    const enrollmentWarning = state.enrollmentError ? `<div class="mx-4 mt-3 p-3 rounded-xl bg-yellow-50 border border-yellow-200 text-yellow-800 text-sm"><b>Lưu ý danh sách trẻ:</b> ${esc(state.enrollmentError)}</div>` : ``;
    const configWarning = state.configError ? `<div class="mx-4 mt-3 p-3 rounded-xl bg-yellow-50 border border-yellow-200 text-yellow-800 text-sm"><b>Lưu ý:</b> ${esc(state.configError)}</div>` : '';
    const loadingNotices = `${state.configLoading ? `<div class="mx-4 mt-3 p-3 rounded-xl bg-blue-50 border border-blue-200 text-blue-800 text-sm flex gap-3 items-start"><div class="loader shrink-0 !w-5 !h-5"></div><div><b>Vui lòng chờ hệ thống tải dữ liệu...</b><br><span class="text-blue-700">Đang tải danh mục giáo viên, trường, lớp và mã bài học. Nếu mạng chậm, app vẫn sẽ mở bằng dữ liệu đã lưu tạm trên máy.</span></div></div>` : ''}${state.enrollmentLoading ? `<div class="mx-4 mt-3 p-3 rounded-xl bg-blue-50 border border-blue-200 text-blue-800 text-sm flex gap-3 items-start"><div class="loader shrink-0 !w-5 !h-5"></div><div><b>Đang tải danh sách trẻ theo lớp...</b><br><span class="text-blue-700">Vui lòng chờ trong giây lát. Nếu chưa tải xong, cô vẫn có thể tiếp tục điền các phần khác rồi quay lại chọn trẻ.</span></div></div>` : ''}`;
    const selectedLesson = lesson();

    document.getElementById('app').innerHTML = `
      ${state.loading ? `<div class="fixed inset-0 z-[999] bg-black/60 flex flex-col items-center justify-center text-white backdrop-blur-sm"><div class="loader mb-3"></div><div class="font-bold">ĐANG XỬ LÝ...</div><div class="text-xs mt-1 text-gray-300">Vui lòng không đóng ứng dụng</div></div>` : ''}
      <div class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-gray-200 pt-[var(--safe-top)] px-4 py-3 shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-orange-50 border border-orange-100 flex items-center justify-center overflow-hidden shrink-0">
            <img src="${SUNBOT_LOGO_URL}" alt="Sunbot" class="w-10 h-10 object-contain" onerror="this.style.display='none'; this.parentNode.innerHTML='<span class=&quot;text-orange-600 font-black text-xs&quot;>SUN</span>'" />
          </div>
          <div class="min-w-0 flex-1">
            <div class="font-bold text-[16px] text-black leading-tight">Báo cáo ca học Sunbot</div>
            <div class="text-[12px] text-gray-500 leading-snug mt-0.5 italic line-clamp-2">“${esc(SESSION_QUOTE)}”</div>
          </div>
        </div>
      </div>
      ${loadingNotices}
      ${configWarning}
      ${enrollmentWarning}
      <div class="mx-4 mt-3">
        <button id="btnEvaluation" class="w-full bg-gradient-to-r from-[#FF6B00] to-amber-400 text-white rounded-xl px-3 py-2.5 shadow-md active-scale flex items-center justify-between text-left">
          <div class="flex items-center gap-2 min-w-0"><div class="w-8 h-8 rounded-xl bg-white/20 flex items-center justify-center shrink-0"><i class="fa-solid fa-clipboard-check text-[15px]"></i></div><div class="min-w-0"><div class="font-bold text-[14px] leading-tight">Đánh giá trẻ</div><div class="text-[11px] text-white/90 leading-tight truncate">Bổ sung đánh giá cá nhân khi cần</div></div></div><i class="fa-solid fa-chevron-right text-white/80 text-[12px]"></i>
        </button>
      </div>

      <div class="mx-4 mt-3 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden p-2 space-y-2">
        <select id="teacher_id" class="w-full h-10 rounded-lg border border-gray-200 px-3 outline-none focus:border-orange-400 text-gray-900">${optionList(cfg.teachers.filter(t=>isTruthy(t.active)), 'teacher_id', t => t.teacher_name, d.teacher_id, 'Chọn giáo viên')}</select>
        <select id="school_id" class="w-full h-10 rounded-lg border border-gray-200 px-3 outline-none focus:border-orange-400 text-gray-900">${optionList(cfg.schools.filter(s=>isTruthy(s.active)), 'school_id', s => s.school_name || s.school_id, d.school_id, 'Chọn trường')}</select>
        <div class="grid grid-cols-2 gap-2">
          <input id="session_date" type="date" value="${esc(d.session_date)}" class="w-full h-10 rounded-lg border border-gray-200 px-3 outline-none focus:border-orange-400" />
          <div class="p-1 bg-gray-100 rounded-lg flex text-[12px] font-bold">
            <button id="typeREG" class="flex-1 py-2 rounded-md transition-all ${d.report_type==='REG'?'bg-white text-black shadow-sm':'text-gray-500'}">Buổi thường</button>
            <button id="typeEOM" class="flex-1 py-2 rounded-md transition-all ${d.report_type==='EOM'?'bg-white text-black shadow-sm':'text-gray-500'}">Cuối tháng</button>
          </div>
        </div>
        <input id="lesson_combo" list="lesson_options" value="${esc(d.lesson_search || (selectedLesson.lesson_id ? lessonLabel(selectedLesson) : ''))}" class="w-full h-10 rounded-lg border border-gray-200 px-3 outline-none focus:border-orange-400 font-medium text-blue-700" placeholder="Gõ L/Q/T/G/K hoặc mã bài..." autocomplete="off" />
        <datalist id="lesson_options"></datalist>
        <div class="flex items-center justify-between gap-2 text-[10px] leading-tight">
          <div class="text-gray-400 truncate">L: Sunbot · Q: STEAM · T: Tổng kết · G: Gigo · K: Khác</div>
          <div id="lesson_status" class="text-gray-400 shrink-0">${esc(lessonSearchSummary()).replace('Chưa lọc bài. ', '')}</div>
        </div>
        <div id="lesson_selected" class="${selectedLesson.lesson_id ? '' : 'hidden'} px-2 py-1 rounded-lg bg-orange-50 text-orange-800 text-[11px] truncate"><span id="lesson_selected_text">${esc(selectedLesson.lesson_id ? lessonLabel(selectedLesson) : '')}</span></div>
      </div>

      ${section('Lớp & sĩ số')}
      ${card(`
        <div class="p-2 space-y-2">
          ${!d.school_id ? `<div class="text-sm text-gray-500 px-1 py-2">Chọn trường để hiện lớp.</div>` : classRows(cls)}
          <div class="flex gap-2 items-center">
            ${d.school_id ? `<button id="btnAddClass" class="flex-1 h-10 rounded-lg border border-dashed border-orange-300 bg-orange-50 text-orange-700 font-bold active-scale text-sm"><i class="fa-solid fa-plus mr-1"></i>Thêm lớp</button>` : ''}
            <div class="${d.school_id ? 'w-32' : 'w-full'} h-10 px-3 rounded-lg bg-gray-50 border border-gray-100 flex justify-between items-center"><span class="font-bold text-gray-600 text-sm">Tổng</span><span class="text-xl font-black text-orange-600">${total}</span></div>
          </div>
        </div>
      `)}

      ${d.report_type === 'REG' ? renderRegularSection() : renderEndMonthSection(children)}
      ${d.report_type === 'REG' ? '' : renderChildSection(children)}
      ${d.report_type === 'REG' ? '' : renderCommentSection()}
      ${d.report_type === 'REG' ? renderRegularPhotos(4) : renderEndMonthPhotos(6)}
      ${renderMemorySection(d.report_type === 'REG' ? 5 : 7)}

      <div class="px-4 pt-8 pb-20">

  }

  function childChip(id, type){ const c = state.config.enrollment.find(x => x.child_id === id) || {child_name:id, class_name:""}; const cls = type === 'outstanding' ? 'bg-orange-50 text-orange-700 border-orange-100' : 'bg-red-50 text-red-700 border-red-100'; return `<button class="child-chip px-3 py-1.5 rounded-full ${cls} border text-xs font-bold" data-type="${type}" data-id="${esc(id)}">${esc(c.child_name)} · ${esc(c.class_name)} ×</button>`; }
  function photoBox(key, label, val){

      <div class="aspect-[16/9] bg-gray-50 flex items-center justify-center overflow-hidden">
        ${val ? `<img src="${val}" class="w-full h-full object-cover" />` : `<div class="text-center text-gray-400 px-4"><i class="fa-solid fa-camera text-3xl mb-2 text-orange-400"></i><div class="font-bold text-[15px] text-gray-500">${esc(label)}</div><div class="text-[11px] text-gray-400 mt-1">Có thể chụp mới hoặc lấy ảnh sẵn</div></div>`}
      </div>
      <div class="grid grid-cols-2 gap-2 p-3 bg-white">
        <label class="h-11 rounded-xl bg-orange-50 text-orange-700 border border-orange-100 flex items-center justify-center text-[13px] font-bold active-scale"><i class="fa-solid fa-camera mr-2"></i>Chụp ảnh<input type="file" accept="image/*" capture="environment" class="hidden photo-input" data-key="${key}" /></label>
        <label class="h-11 rounded-xl bg-blue-50 text-blue-700 border border-blue-100 flex items-center justify-center text-[13px] font-bold active-scale"><i class="fa-solid fa-folder-open mr-2"></i>Chọn ảnh<input type="file" accept="image/*" class="hidden photo-input" data-key="${key}" /></label>
      </div>

  function updateLessonDatalist(){
    const dl = $('lesson_options');
    if(!dl) return;
    const rows = filteredLessons();
    dl.innerHTML = rows.map(l => `<option value="${esc(lessonLabel(l))}"></option>`).join('');
  }
  function updateLessonStatus(){
    const status = $('lesson_status');
    if(status) status.textContent = lessonSearchSummary();
    const box = $('lesson_selected');
    const txt = $('lesson_selected_text');
    const selected = lesson();
    if(box && txt){
      if(selected.lesson_id){ box.classList.remove('hidden'); txt.textContent = lessonLabel(selected); }
      else { box.classList.add('hidden'); txt.textContent = ''; }
    }
  }

  function bindEvents(){
    const on = (id, ev, fn) => { const el=$(id); if(el) el.addEventListener(ev, fn); };
    on('btnEvaluation','click',()=>{ window.location.href = EVALUATION_APP_URL; });
    on('teacher_id','change',e=>{ state.data.teacher_id=e.target.value; saveLocal(); render(); });
    on('school_id','change',e=>{ state.data.school_id=e.target.value; state.data.selected_classes=['']; state.data.class_attendance={}; state.data.outstanding_children=[]; state.data.attention_children=[]; saveLocal(); render(); });
    on('session_date','change',e=>{ state.data.session_date=e.target.value; saveLocal(); });
    on('lesson_combo','input',e=>{
      const val = e.target.value;
      state.data.lesson_search = val;
      const found = findLessonByInput(val);
      state.data.lesson_id = found ? found.lesson_id : '';
      saveLocal();
      updateLessonDatalist();
      updateLessonStatus();
    });
    on('lesson_combo','change',e=>{
      const found = findLessonByInput(e.target.value);
      if(found){ state.data.lesson_id = found.lesson_id; state.data.lesson_search = lessonLabel(found); e.target.value = lessonLabel(found); }
      saveLocal();
      updateLessonDatalist();
      updateLessonStatus();
    });
    on('typeREG','click',()=>{ state.data.report_type='REG'; render(); });
    on('typeEOM','click',()=>{ state.data.report_type='EOM'; render(); });
    on('btnAddClass','click',()=>{ state.data.selected_classes.push(''); render(); });

    document.querySelectorAll('.class-row-select').forEach(el=>el.addEventListener('change', e=>{
      const idx = Number(e.target.dataset.idx); const old = state.data.selected_classes[idx]; const val = e.target.value;
      if(old && old !== val) delete state.data.class_attendance[old];
      state.data.selected_classes[idx] = val; state.data.outstanding_children=[]; state.data.attention_children=[]; render();
    }));
    document.querySelectorAll('.btn-remove-class').forEach(el=>el.addEventListener('click',()=>{ const idx=Number(el.dataset.idx); const old=state.data.selected_classes[idx]; if(old) delete state.data.class_attendance[old]; state.data.selected_classes.splice(idx,1); if(!state.data.selected_classes.length) state.data.selected_classes=['']; state.data.outstanding_children=[]; state.data.attention_children=[]; render(); }));
    document.querySelectorAll('.attendance-input').forEach(el=>el.addEventListener('input', e=>{ const cid=e.target.dataset.classid; if(cid) state.data.class_attendance[cid] = e.target.value; }));
    document.querySelectorAll('.attendance-input').forEach(el=>el.addEventListener('change', render));
    document.querySelectorAll('.checkline').forEach(el=>el.addEventListener('click',()=>{ const idx=Number(el.dataset.idx); state.data.checklist[idx]=!state.data.checklist[idx]; render(); }));
    document.querySelectorAll('.criteria-btn').forEach(el=>el.addEventListener('click',()=>{ const idx=Number(el.dataset.idx); state.data.criteria[idx]=el.dataset.value; render(); }));
    on('incidentNo','click',()=>{ state.data.incident_status='NO'; state.data.incident_desc=''; render(); });
    on('incidentYes','click',()=>{ state.data.incident_status='YES'; render(); });
    on('incident_desc','input',e=>state.data.incident_desc=e.target.value);
    on('child_note_text','input',e=>state.data.child_note_text=e.target.value);
    on('highlight','input',e=>state.data.highlight=e.target.value);
    on('teacher_comment','input',e=>state.data.teacher_comment=e.target.value);
    on('next_plan','input',e=>state.data.next_plan=e.target.value);
    on('outstanding_child_select','change',e=>{ addChild('outstanding_children', e.target.value); e.target.value=''; render(); });
    on('attention_child_select','change',e=>{ addChild('attention_children', e.target.value); e.target.value=''; render(); });
    document.querySelectorAll('.child-chip').forEach(el=>el.addEventListener('click',()=>{ const key = el.dataset.type==='outstanding' ? 'outstanding_children' : 'attention_children'; state.data[key] = state.data[key].filter(x=>x!==el.dataset.id); render(); }));
    document.querySelectorAll('.photo-input').forEach(el=>el.addEventListener('change', handlePhoto));
    document.querySelectorAll('.monthly-photo-input').forEach(el=>el.addEventListener('change', handleMonthlyPhoto));
    document.querySelectorAll('.monthly-photo-cat').forEach(el=>el.addEventListener('change',e=>{ const idx=Number(e.target.dataset.idx); state.data.monthly_photos[idx].cat=e.target.value; }));
    on('memory_enabled','change',e=>{ state.data.memory_enabled=e.target.checked; render(); });
    on('memory_title','input',e=>state.data.memory_title=e.target.value);
    on('memory_signal','change',e=>state.data.memory_signal=e.target.value);
    on('memory_description','input',e=>state.data.memory_description=e.target.value);
    on('submitBtn','click',submit);
    updateLessonDatalist();
    updateLessonStatus();
  }

  function addChild(key, id){ if(id && !state.data[key].includes(id)) state.data[key].push(id); }
  async function handlePhoto(e){ const file=e.target.files&&e.target.files[0]; if(!file) return; const key=e.target.dataset.key; try { state.loading=true; render(); state.data[key]=await compressImage(file); } catch(err){ alert('Không xử lý được ảnh.'); } finally { state.loading=false; render(); } }
  async function handleMonthlyPhoto(e){ const file=e.target.files&&e.target.files[0]; if(!file) return; const idx=Number(e.target.dataset.idx); try { state.loading=true; render(); state.data.monthly_photos[idx].img=await compressImage(file); } catch(err){ alert('Không xử lý được ảnh.'); } finally { state.loading=false; render(); } }
  function compressImage(file){ return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=()=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>h&&w>MAX_IMAGE_PX){h=Math.round(h*MAX_IMAGE_PX/w);w=MAX_IMAGE_PX;} else if(h>=w&&h>MAX_IMAGE_PX){w=Math.round(w*MAX_IMAGE_PX/h);h=MAX_IMAGE_PX;} const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h; canvas.getContext('2d').drawImage(img,0,0,w,h); resolve(canvas.toDataURL('image/jpeg',IMAGE_QUALITY)); }; img.onerror=reject; img.src=reader.result; }; reader.onerror=reject; reader.readAsDataURL(file); }); }

  function validate(){
    const d=state.data;
    if(!d.teacher_id) return 'Vui lòng chọn giáo viên.';
    if(!d.school_id) return 'Vui lòng chọn trường.';
    if(!d.session_date) return 'Vui lòng chọn ngày dạy.';
    if(!d.lesson_id) return 'Vui lòng chọn bài học.';
    const ids = selectedClassIds();
    if(!ids.length) return 'Vui lòng chọn ít nhất 1 lớp.';
    for(const cid of ids){ const n=Number(d.class_attendance[cid]); const cname=classObj(cid).class_name || cid; if(!Number.isFinite(n)||n<=0) return `Vui lòng nhập sĩ số của lớp ${cname}.`; }
    if(d.report_type==='REG' && checklistMissingCount()) return `Vui lòng tick đủ ${CHECKLIST.length} mục checklist vận hành trước khi gửi báo cáo.`;
    if(d.report_type==='REG' && !d.attendance_photo_b64) return 'Vui lòng chụp/chọn ảnh minh chứng sĩ số hoặc lớp học.';
    if(d.report_type==='EOM' && d.monthly_photos.filter(x=>x.img).length===0) return 'Vui lòng bổ sung ít nhất 1 ảnh minh chứng cuối tháng.';
    if(d.memory_enabled && (!norm(d.memory_title)||!norm(d.memory_signal)||!norm(d.memory_description))) return 'Thẻ ký ức đã bật. Vui lòng điền đủ tiêu đề, tín hiệu và mô tả.';
    return '';
  }

  function buildPayload(){
    const d=state.data, t=teacher(), s=school(), l=lesson();
    const classes = selectedClassIds().map(cid=>({ class_id:cid, class_name:classObj(cid).class_name || cid, attendance_count:Number(d.class_attendance[cid])||0 }));
    const childObj = (id) => { const c=state.config.enrollment.find(x=>x.child_id===id)||{}; return {child_id:id,enrollment_id:c.enrollment_id||'',child_name:c.child_name||id,class_id:c.class_id||'',class_name:c.class_name||''}; };
    return {
      app_version: APP_VERSION, action:'submit_report_v2', created_client_at:new Date().toISOString(),
      teacher_id:d.teacher_id, teacher_name:t.teacher_name||'', school_id:d.school_id, school_name:s.school_name||'', session_date:d.session_date,
      lesson_id:d.lesson_id, lesson_code:l.lesson_code||'', lesson_name:l.lesson_name||'', report_type:d.report_type, session_type:d.report_type === 'EOM' ? 'END_OF_MONTH' : 'REGULAR',
      classes, total_attendance:totalAttendance(), checklist:CHECKLIST.map((x,i)=>({item:x,checked:!!d.checklist[i]})),
      criteria:CRITERIA.map((x,i)=>({item:x,value:d.criteria[i]})), incident_status:d.incident_status, incident_desc:d.incident_desc,
      attendance_photo_b64:d.attendance_photo_b64, activity_photo_b64:"", memory_photo_b64:d.memory_photo_b64, monthly_photos:d.monthly_photos,
      highlight:d.highlight, needs_attention:d.child_note_text || '', teacher_comment:d.teacher_comment, next_plan:d.next_plan,
      outstanding_children:d.outstanding_children.map(childObj), attention_children:d.attention_children.map(childObj),
      memory:d.memory_enabled ? {title:d.memory_title, child_signal:d.memory_signal, description:d.memory_description} : null
    };
  }

  async function submit(){
    const msg=validate(); if(msg){ alert(msg); return; }
    if(!WEB_APP_URL || WEB_APP_URL.includes('PASTE_GOOGLE_APPS_SCRIPT')){ alert('Chưa dán WEB_APP_URL của Apps Script trong file HTML.'); return; }
    state.loading=true; render();
    try { const res=await fetch(WEB_APP_URL,{method:'POST',body:JSON.stringify(buildPayload())}); const json=await res.json(); if(json.status!=='success') throw new Error(json.message||'Server không trả về success'); state.lastResult=json; resetAfterSubmit(); alert('🎉 Gửi báo cáo thành công!\nMã ca học: '+(json.session_id||'')); window.scrollTo(0,0); }
    catch(err){ alert('❌ Lỗi gửi báo cáo: '+err.message); }
    finally{ state.loading=false; render(); }
  }
  function resetAfterSubmit(){
    const d=state.data; d.selected_classes=['']; d.class_attendance={}; d.checklist=CHECKLIST.map(()=>false); d.incident_status='NO'; d.incident_desc=''; d.attendance_photo_b64=''; d.activity_photo_b64=''; d.criteria=CRITERIA.map(()=>"Đạt"); d.monthly_photos=Array(6).fill(0).map(()=>({cat:PHOTO_CATS[0],img:""})); d.outstanding_children=[]; d.attention_children=[]; d.child_note_text=''; d.highlight=''; d.needs_attention=''; d.teacher_comment=''; d.next_plan=''; d.memory_enabled=false; d.memory_title=''; d.memory_signal=''; d.memory_description=''; d.memory_photo_b64='';
  }

  function selectedClassKey(){ return selectedClassIds().sort().join('|'); }
  function applyConfig(json){
    state.config.teachers = json.teachers || [];
    state.config.schools = json.schools || [];
    state.config.classes = json.classes || [];
    state.config.lessons = json.lessons || [];
    // Không tải toàn bộ danh sách trẻ khi mở app; chỉ tải theo lớp được chọn để tăng tốc.
    if(json.enrollment) state.config.enrollment = json.enrollment || [];
  }
  function loadConfigFromCache(){
    try{
      const raw = localStorage.getItem(CONFIG_CACHE_KEY);
      if(!raw) return false;
      const cached = JSON.parse(raw);
      if(!cached || !cached.saved_at || (Date.now() - cached.saved_at > CONFIG_CACHE_TTL_MS)) return false;
      applyConfig(cached.data || {});
      state.configError = 'Đang dùng danh mục đã lưu trên máy để mở nhanh; hệ thống sẽ tự cập nhật nền.';
      return true;
    } catch(e){ return false; }
  }
  function saveConfigToCache(data){
    try{ localStorage.setItem(CONFIG_CACHE_KEY, JSON.stringify({saved_at:Date.now(), data:data})); } catch(e){}
  }
  function loadEnrollmentFromCache(key){
    try{
      const raw = localStorage.getItem(ENROLLMENT_CACHE_PREFIX + key);
      if(!raw) return null;
      const cached = JSON.parse(raw);
      if(!cached || !cached.saved_at || (Date.now() - cached.saved_at > CONFIG_CACHE_TTL_MS)) return null;
      return cached.data || [];
    } catch(e){ return null; }
  }
  function saveEnrollmentToCache(key, rows){
    try{ localStorage.setItem(ENROLLMENT_CACHE_PREFIX + key, JSON.stringify({saved_at:Date.now(), data:rows || []})); } catch(e){}
  }
  async function fetchEnrollmentForSelectedClasses(){
    const ids = selectedClassIds();
    if(!ids.length || !WEB_APP_URL || WEB_APP_URL.includes('PASTE_GOOGLE_APPS_SCRIPT')) return;
    const key = selectedClassKey();
    const cached = loadEnrollmentFromCache(key);
    if(cached){ state.config.enrollment = cached; state.enrollmentError=''; render(); return; }
    state.enrollmentLoading = true; state.enrollmentError=''; render();
    try{
      const url = WEB_APP_URL + '?action=enrollment&class_ids=' + encodeURIComponent(ids.join(','));
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 7000);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      const json = await res.json();
      if(json.status !== 'success') throw new Error(json.message || 'Không tải được danh sách trẻ theo lớp');
      state.config.enrollment = json.enrollment || [];
      saveEnrollmentToCache(key, state.config.enrollment);
    } catch(err){
      state.enrollmentError = String((err && err.name === 'AbortError') ? 'Tải danh sách trẻ quá lâu. Có thể tiếp tục báo cáo, nhưng chưa chọn được trẻ.' : (err.message || err));
    } finally { state.enrollmentLoading=false; render(); }
  }

  async function loadConfig(){
    const hadCache = loadConfigFromCache();
    state.configLoading = !hadCache;
    render();
    try{
      if(!WEB_APP_URL || WEB_APP_URL.includes('PASTE_GOOGLE_APPS_SCRIPT')) throw new Error('Chưa dán WEB_APP_URL. Đang dùng dữ liệu demo.');
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 9000);
      const res = await fetch(WEB_APP_URL + '?action=config&v=' + Date.now(), { signal: controller.signal });
      clearTimeout(timer);
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch(parseErr) { throw new Error('Apps Script không trả về JSON hợp lệ. Kiểm tra deploy Web App và quyền truy cập.'); }
      if(json.status !== 'success') throw new Error(json.message || 'Không tải được danh mục');
      const cfg = {teachers:json.teachers||[], schools:json.schools||[], classes:json.classes||[], lessons:json.lessons||[]};
      applyConfig(cfg);
      saveConfigToCache(cfg);
      state.configError = '';
      if(selectedClassIds().length) fetchEnrollmentForSelectedClasses();
    } catch(err){
      if(!hadCache){
        state.config = DEMO_CONFIG;
        state.configError = String((err && err.name === 'AbortError') ? 'Tải danh mục quá lâu. App đang dùng dữ liệu demo để tránh trắng màn hình.' : (err.message || err));
      } else {
        state.configError = 'Không cập nhật được danh mục mới, tạm dùng danh mục đã lưu trên máy. Chi tiết: ' + String((err && err.message) || err);
      }
    }
    finally{ state.configLoading=false; render(); }
  }

  loadLocal();
  render();
  loadConfig();
})();
</script>
</body>
</html>
